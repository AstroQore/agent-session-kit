name: CI (Swift)

on:
  push:
    branches: [main]
    paths:
      - "Package.swift"
      - "implementations/swift/**"
      - "contracts/**"
      - ".github/workflows/ci-swift.yml"
  # No path filter on pull requests: "Build and test" is a required check, and
  # a filtered workflow simply never reports on a docs-only change, so the
  # branch rule waits forever for a run that cannot start. Pushes to main stay
  # filtered — there the run is informational, not a gate.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    # The package targets macOS 26; `macos-latest` is the fallback while
    # `macos-26` images roll out, and the build will fail loudly on an
    # older SDK rather than silently testing something else.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test -v
